name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: gate
        run: gates/gate.sh --full

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add the sign-off with:  git commit -s --amend   (or git rebase --signoff)"
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "all commits signed off"

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: build
        shell: bash
        run: |
          scripts/build.sh "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: release notes from the changelog
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v head="## [$ver]" 'index($0, head) == 1 { on = 1; next } /^## \[/ { on = 0 } /^\[/ { on = 0 } on' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          cat release-notes.md
      - name: attest provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
